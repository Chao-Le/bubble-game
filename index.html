    <style>
        body {
            /* Prevent scrolling and zooming for a native app feel */
            overscroll-behavior: none;
            touch-action: none;
        }

        .bubble {
            /* 3D soap bubble effect */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(240,248,255,0.7) 60%, rgba(200,220,255,0.5));
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 
                inset -5px -5px 15px rgba(0,0,0,0.05),
                inset 5px 5px 15px rgba(255,255,255,0.9),
                0 6px 12px rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }

        /* Stop float animation when selected */
        .bubble.selected {
            transform: scale(1.15) !important;
            box-shadow: 
                0 0 0 4px #FCD34D,
                0 0 25px 8px rgba(252, 211, 77, 0.7),
                inset -5px -5px 15px rgba(0,0,0,0.05),
                inset 5px 5px 15px rgba(255,255,255,0.9);
            border-color: transparent;
            z-index: 50;
        }

        /* Error state: flashes red and shakes */
        .bubble.wrong {
            background: #FCA5A5 !important;
            background-image: none !important;
            border-color: #EF4444 !important;
            color: white !important;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important;
        }

        /* Success state: turns green, pops, and vanishes */
        .bubble.matched {
            background: #86EFAC !important;
            background-image: none !important;
            border-color: #22C55E !important;
            color: #14532D !important;
            animation: popOut 0.5s ease-out forwards !important;
            pointer-events: none; /* Prevent clicking during pop */
            z-index: 40;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes popOut {
            0% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 20px #4ADE80; }
            40% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; visibility: hidden; }
        }

        @keyframes wise-blink {
            0%, 95%, 98%, 100% { transform: scaleY(1); }
            96%, 99% { transform: scaleY(0.1); }
        }

        .wise-eye {
            animation: wise-blink 4s infinite;
        }
        
        /* Particle animation class applied via JS */
        .splash-particle {
            border-radius: 50%;
            pointer-events: none;
            position: absolute;
            z-index: 100;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- STORAGE SETUP ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'language-bubbles-app';
        let app, db, auth, userId;
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig);
                // Enable offline persistence caching for seamless PWA usage
                db = initializeFirestore(app, {
                    localCache: persistentLocalCache()
                });
                auth = getAuth(app);
                initStorage();
            }
        } catch (error) {
            console.warn("Storage initialization skipped:", error);
        }

        async function initStorage() {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser?.uid;
                if (userId) {
                    await loadSettings();
                }
            } catch (error) {
                console.error("Auth failed:", error);
            }
        }

        async function loadSettings() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.fontSizeLevel) {
                        currentFontSizeLevel = data.fontSizeLevel;
                        fontSizeSlider.value = currentFontSizeLevel;
                        const labels = {1: 'Очень мелкий', 2: 'Мелкий', 3: 'Средний', 4: 'Крупный', 5: 'Огромный'};
                        fontSizeVal.textContent = labels[currentFontSizeLevel];
                    }
                    if (data.targetRoundSize) {
                        TARGET_ROUND_SIZE = data.targetRoundSize;
                        pairCountSlider.value = TARGET_ROUND_SIZE;
                        pairCountVal.textContent = TARGET_ROUND_SIZE;
                    }
                }
            } catch (error) {
                console.error("Failed to load settings:", error);
            }
        }

        async function saveSettings() {
            if (!userId || !db) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId);
                await setDoc(docRef, {
                    fontSizeLevel: currentFontSizeLevel,
                    targetRoundSize: TARGET_ROUND_SIZE
                });
            } catch (error) {
                console.error("Failed to save settings:", error);
            }
        }

        // --- GAME DATA ---
        // All words from the provided list
        const allWordPairs = [
            { id: 1, en: "yesterday", ru: "вчера" },
            { id: 2, en: "all", ru: "все" },
            { id: 3, en: "my", ru: "мои" },
            { id: 4, en: "troubles", ru: "неприятности" },
            { id: 5, en: "seemed", ru: "казались" },
            { id: 6, en: "so", ru: "так" },
            { id: 7, en: "far", ru: "далеко" },
            { id: 8, en: "away", ru: "прочь" },
            { id: 9, en: "now", ru: "сейчас" },
            { id: 10, en: "it", ru: "это" },
            { id: 11, en: "looks", ru: "выглядит" },
            { id: 12, en: "as", ru: "как" },
            { id: 13, en: "though", ru: "будто" },
            { id: 14, en: "they're", ru: "они" },
            { id: 15, en: "here", ru: "здесь" },
            { id: 16, en: "to", ru: "чтобы" },
            { id: 17, en: "stay", ru: "остаться" },
            { id: 18, en: "i", ru: "я" },
            { id: 19, en: "believe", ru: "верю" },
            { id: 20, en: "in", ru: "в" },
            { id: 21, en: "suddenly", ru: "внезапно" },
            { id: 22, en: "i'm", ru: "я" },
            { id: 23, en: "not", ru: "не" },
            { id: 24, en: "half", ru: "половина" },
            { id: 25, en: "the", ru: "этот" },
            { id: 26, en: "man", ru: "мужчина" },
            { id: 27, en: "used", ru: "привык" },
            { id: 28, en: "be", ru: "быть" },
            { id: 29, en: "there's", ru: "там есть" },
            { id: 30, en: "a", ru: "какой-то" },
            { id: 31, en: "shadow", ru: "тень" },
            { id: 32, en: "hangin'", ru: "висящий (разг.)" },
            { id: 33, en: "over", ru: "над" },
            { id: 34, en: "me", ru: "мной" },
            { id: 35, en: "came", ru: "пришла" },
            { id: 36, en: "why", ru: "почему" },
            { id: 37, en: "she", ru: "она" },
            { id: 38, en: "had", ru: "должна была" },
            { id: 39, en: "go", ru: "идти" },
            { id: 40, en: "don't", ru: "не" },
            { id: 41, en: "know", ru: "знаю" },
            { id: 42, en: "wouldn't", ru: "не стала бы" },
            { id: 43, en: "say", ru: "сказать" },
            { id: 44, en: "said", ru: "сказал" },
            { id: 45, en: "something", ru: "что-то" },
            { id: 46, en: "wrong", ru: "неправильное" },
            { id: 47, en: "long", ru: "тоскую" },
            { id: 48, en: "for", ru: "по" },
            { id: 49, en: "love", ru: "любовь" },
            { id: 50, en: "was", ru: "была" },
            { id: 51, en: "such", ru: "такой" },
            { id: 52, en: "an", ru: "какой-то" },
            { id: 53, en: "easy", ru: "легкая" },
            { id: 54, en: "game", ru: "игра" },
            { id: 55, en: "play", ru: "играть" },
            { id: 56, en: "need", ru: "нуждаюсь" },
            { id: 57, en: "place", ru: "место" },
            { id: 58, en: "hide", ru: "спрятаться" }
        ];

        // --- GAME STATE ---
        let TARGET_ROUND_SIZE = 10; // Target number of pairs to show per round
        let currentFontSizeLevel = 3; // Bubble font size (1 to 5)
        let currentRoundPairs = [];
        let selectedBubble = null;
        let matchedCount = 0;
        let firstTryMatches = 0;
        let mistakes = new Set(); // Stores pair IDs that were guessed incorrectly

        // DOM Elements
        const screens = {
            home: document.getElementById('home-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen'),
            settings: document.getElementById('settings-screen')
        };
        const engZone = document.getElementById('eng-zone');
        const ruZone = document.getElementById('ru-zone');
        const scoreText = document.getElementById('score-text');
        const totalScoreElement = document.getElementById('total-score');
        const motivationalText = document.getElementById('motivational-text');
        
        // Settings Elements
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const fontSizeSlider = document.getElementById('font-size-slider');
        const pairCountSlider = document.getElementById('pair-count-slider');
        const fontSizeVal = document.getElementById('font-size-val');
        const pairCountVal = document.getElementById('pair-count-val');

        // Utility to smoothly crossfade between screens
        function showScreen(screenName) {
            Object.keys(screens).forEach(key => {
                const el = screens[key];
                if (key === screenName) {
                    el.style.display = 'flex';
                    // Small delay to allow display:flex to apply before changing opacity for transition
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.pointerEvents = 'auto';
                    }, 30);
                } else {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    // Wait for fade out animation to complete before hiding
                    setTimeout(() => {
                        if (el.style.opacity === '0') {
                            el.style.display = 'none';
                        }
                    }, 500);
                }
            });
        }

        function startGame() {
            // Reset state
            selectedBubble = null;
            matchedCount = 0;
            firstTryMatches = 0;
            mistakes.clear();
            engZone.innerHTML = '';
            ruZone.innerHTML = '';

            // Pick a random subset of words for this round based on settings
            currentRoundPairs = shuffleArray([...allWordPairs]).slice(0, TARGET_ROUND_SIZE);

            // Show screen first to allow DOM measuring
            showScreen('game');

            // Recursive function to fit bubbles perfectly on any screen size
            function renderAndFit() {
                engZone.innerHTML = '';
                ruZone.innerHTML = '';

                // Generate, shuffle, and append bubbles
                const engBubbles = currentRoundPairs.map(p => createBubble(p.en, p.id, 'en'));
                const ruBubbles = currentRoundPairs.map(p => createBubble(p.ru, p.id, 'ru'));

                shuffleArray(engBubbles).forEach(b => engZone.appendChild(b));
                shuffleArray(ruBubbles).forEach(b => ruZone.appendChild(b));
                
                // Allow browser to calculate layout before checking dimensions
                requestAnimationFrame(() => {
                    // Check if content overflows its container
                    // Added a small buffer (5px) to prevent borderline tight fits
                    const engOverflow = engZone.scrollHeight > engZone.clientHeight + 5;
                    const ruOverflow = ruZone.scrollHeight > ruZone.clientHeight + 5;

                    // If it overflows and we still have more than 4 pairs, reduce and try again
                    if ((engOverflow || ruOverflow) && currentRoundPairs.length > 4) {
                        currentRoundPairs.pop(); // Remove one pair
                        renderAndFit(); // Try fitting again
                    } else {
                        // Fit successful! Update the total score display
                        if (totalScoreElement) {
                            totalScoreElement.textContent = `/ ${currentRoundPairs.length}`;
                        }
                    }
                });
            }

            renderAndFit();
        }

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createBubble(text, pairId, lang) {
            const bubble = document.createElement('div');
            
            // Map font size slider (1-5) to tailwind sizing classes
            const fontClasses = {
                1: 'text-xs md:text-sm',
                2: 'text-sm md:text-base',
                3: 'text-base md:text-lg',
                4: 'text-lg md:text-xl',
                5: 'text-xl md:text-2xl'
            };
            const activeFontClass = fontClasses[currentFontSizeLevel] || fontClasses[3];
            
            // Responsive oval sizing: width fits content based on word length
            bubble.className = `bubble rounded-full px-5 py-2 md:px-6 md:py-3
                                flex items-center justify-center text-center cursor-pointer 
                                font-bold text-gray-800 leading-tight ${activeFontClass}
                                whitespace-nowrap overflow-hidden relative shadow-sm`;
            
            // Reduced random offset so ovals pack better without overlapping too much
            const offsetX = Math.random() * 8 - 4;
            const offsetY = Math.random() * 8 - 4;
            bubble.style.margin = `${offsetY}px ${offsetX}px`;
            
            bubble.textContent = text;
            bubble.dataset.pairId = pairId;
            bubble.dataset.lang = lang;
            
            // Use pointerdown for zero-latency touch response
            bubble.addEventListener('pointerdown', handleBubbleClick);
            
            return bubble;
        }

        function handleBubbleClick(e) {
            e.preventDefault(); // Prevent standard click/zoom actions
            const bubble = e.currentTarget;

            // Ignore taps on already matched or currently selected bubbles
            if (bubble.classList.contains('matched') || bubble === selectedBubble) {
                return;
            }

            if (!selectedBubble) {
                // Scenario 1: First bubble tapped
                selectedBubble = bubble;
                bubble.classList.add('selected');
                return;
            }

            // Scenario 2: Second bubble tapped - Evaluate match
            const pairId1 = parseInt(selectedBubble.dataset.pairId);
            const pairId2 = parseInt(bubble.dataset.pairId);
            const lang1 = selectedBubble.dataset.lang;
            const lang2 = bubble.dataset.lang;

            let isMatch = false;

            if (lang1 !== lang2) {
                if (pairId1 === pairId2) {
                    isMatch = true;
                } else {
                    const pair1 = currentRoundPairs.find(p => p.id === pairId1);
                    const pair2 = currentRoundPairs.find(p => p.id === pairId2);
                    
                    // Allow interchangeable matching for identical words in either language
                    if (pair1 && pair2 && (pair1.en === pair2.en || pair1.ru === pair2.ru)) {
                        isMatch = true;
                    }
                }
            }

            if (isMatch) {
                // --- CORRECT MATCH ---
                
                // If this pair hasn't been failed before, it's a first-try success!
                if (!mistakes.has(pairId1)) {
                    firstTryMatches++;
                }

                // Apply success visuals to both
                selectedBubble.classList.remove('selected');
                selectedBubble.classList.add('matched');
                bubble.classList.add('matched');

                // Trigger particle splash
                createSplash(selectedBubble);
                createSplash(bubble);

                selectedBubble = null;
                matchedCount++;

                // Check win condition
                if (matchedCount === currentRoundPairs.length) {
                    setTimeout(endGame, 1000); // Wait for final pop animations
                }

            } else {
                // --- INCORRECT MATCH ---
                
                // Record mistake for the first selected item, so it loses its "first try" point.
                // We do not penalize the second item so that one mistake equals exactly one lost point.
                mistakes.add(pairId1);

                // Flash the wrongly tapped bubble red
                bubble.classList.add('wrong');
                
                // Per instructions: "first tapped bubble continues to be highlighted"
                // So we do NOT clear selectedBubble. User must find the matching translation.
                
                // Remove the red flash class after animation completes so it can be tapped again
                setTimeout(() => {
                    bubble.classList.remove('wrong');
                }, 500);
            }
        }

        function createSplash(element) {
            const rect = element.getBoundingClientRect();
            // Center of the bubble
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const colors = ['#4ADE80', '#22C55E', '#16A34A', '#86EFAC'];
            const particleCount = 12 + Math.random() * 5;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle shadow-sm';
                
                // Random size 6px to 12px
                const size = 6 + Math.random() * 6; 
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                
                document.body.appendChild(particle);
                
                // Physics: random angle and distance
                const angle = Math.random() * Math.PI * 2;
                const velocity = 40 + Math.random() * 60; // Spread distance
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                // Animate out and fade
                const animation = particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 300,
                    easing: 'cubic-bezier(0, 0.9, 0.57, 1)'
                });
                
                // Cleanup DOM after animation
                animation.onfinish = () => particle.remove();
            }
        }

        function endGame() {
            // Update Result UI
            scoreText.textContent = firstTryMatches;
            
            if (firstTryMatches === currentRoundPairs.length) {
                motivationalText.textContent = "Идеально! Ни одной ошибки!"; // Perfect! Not a single mistake!
                motivationalText.className = "text-lg font-black text-pink-500 mb-6";
            } else if (firstTryMatches >= currentRoundPairs.length / 2) {
                motivationalText.textContent = "Отличная работа! Продолжай в том же духе!"; // Great job! Keep it up!
                motivationalText.className = "text-lg text-gray-700 font-bold mb-6";
            } else {
                motivationalText.textContent = "Хорошая попытка! В следующий раз получится лучше!"; // Good try! Better next time!
                motivationalText.className = "text-lg text-gray-700 font-bold mb-6";
            }

            showScreen('result');
        }

        // --- EVENT LISTENERS ---
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('home-btn').addEventListener('click', () => showScreen('home'));

        // Settings Listeners
        settingsBtn.addEventListener('click', () => showScreen('settings'));
        closeSettingsBtn.addEventListener('click', () => {
            showScreen('home');
            saveSettings();
        });

        const sizeLabels = {1: 'Очень мелкий', 2: 'Мелкий', 3: 'Средний', 4: 'Крупный', 5: 'Огромный'};
        
        fontSizeSlider.addEventListener('input', (e) => {
            currentFontSizeLevel = parseInt(e.target.value);
            fontSizeVal.textContent = sizeLabels[currentFontSizeLevel];
        });

        pairCountSlider.addEventListener('input', (e) => {
            TARGET_ROUND_SIZE = parseInt(e.target.value);
            pairCountVal.textContent = TARGET_ROUND_SIZE;
        });

    </script>
